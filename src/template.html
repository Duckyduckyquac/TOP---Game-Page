<!DOCTYPE html>
    <head>
        <title>Responsive Game Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="home-container">
        <header class="home-container__header">
            <button id="menu-toggle" class="toggle-button header__toggle-button">
                <img src="./assets/svgs/menu.svg" alt="menu-icon" class="icon toggle-button__icon"/> 
            </button>

            <div class="header__text-group">
                <h1>Responsive Design Game Page</h1>
                <p>A viewer for all of your games</p>
            </div>
        </header>

        <div class="home-container__backdrop home-container__backdrop--hidden">

        </div>

        <aside class="home-container__sidebar home-container__sidebar--hidden">
            <div class="sidebar__button-wrapper">
                <label for="dark-mode-toggle">Toggle Dark Mode</label>
                <button id="dark-mode-toggle" class="toggle-button button-wrapper__toggle-button">
                    <img src="./assets/svgs/dark-mode-outline.svg" alt="dark-mode-outline-icon" class="icon toggle-button__icon">
                </button>
            </div>

            <div class="sidebar__button-wrapper">
                <label for="show-developer-information-button">Credits to the Developer</label>
                <button id="show-developer-information-button" class="toggle-button button-wrapper__toggle-button">
                    <img src="./assets/svgs/developer.svg" alt="developer-icon" class="icon toggle-button__icon">
                </button>
            </div>
        </aside>

        <div class="home-container__developer-credit home-container__developer-credit--hidden">
            <h1>Acknowledgement</h1>
            <p>This practice exercise was accomplished by Duckyduckyquac (Jacob)</p>
            <button class="developer-credit__close-button"><span class="close-button__span">Close</span></button>
        </div>

        <main class ="home-container__main-content">
            
        </main>

        <footer class="home-container__footer">
            <h1 class="footer__h1">Do you have any questions?</h1>
            <p class="footer__p">
                Message the developer through <a href="mailto:juanjacobmark779@gmail.com" class="footer_a">juanjacobmark779@gmail.com</a>
            </p>
        </footer>
    </body>
</html>
